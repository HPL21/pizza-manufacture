apiVersion: apps/v1
kind: Deployment
metadata:
  name: pizza-gui
spec:
  replicas: {{ .Values.gui.replicas }}
  selector:
    matchLabels:
      app: pizza-gui
  template:
    metadata:
      labels:
        app: pizza-gui
    spec:
      serviceAccountName: pizza-sa
      containers:
        - name: pizza-gui
          image: {{ .Values.gui.image }}
          imagePullPolicy: Never
          ports:
            - containerPort: {{ .Values.gui.port }}
          resources:
            {{- toYaml .Values.gui.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.gui.livenessProbe.path }}
              port: {{ .Values.gui.port }}
            initialDelaySeconds: {{ .Values.gui.livenessProbe.initialDelaySeconds }}
---
apiVersion: v1
kind: Service
metadata:
  name: pizza-gui-service
spec:
  type: {{ .Values.gui.serviceType }}
  selector:
    app: pizza-gui
  ports:
    - protocol: TCP
      port: {{ .Values.gui.port }}
      targetPort: {{ .Values.gui.port }}