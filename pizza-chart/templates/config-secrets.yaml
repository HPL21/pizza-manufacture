apiVersion: v1
kind: Secret
metadata:
  name: pizza-db-secret
type: Opaque
data:
  postgres-password: {{ .Values.postgres.password | b64enc | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pizza-config
data:
  db-host: "postgres-service"
  db-name: {{ .Values.postgres.dbName | quote }}