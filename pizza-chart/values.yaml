namespace: pizza-factory

postgres:
  image: postgres:16
  password: "root"
  dbName: "pizza-manufacture"
  storageSize: "1Gi"

api:
  image: pizza-api:v1
  replicas: 1
  port: 5003
  serviceType: ClusterIP
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  livenessProbe:
    path: /health
    initialDelaySeconds: 10
  readinessProbe:
    path: /health
    initialDelaySeconds: 5

gui:
  image: pizza-gui:v1
  replicas: 1
  port: 80
  serviceType: ClusterIP
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "250m"
  livenessProbe:
    path: /
    initialDelaySeconds: 5