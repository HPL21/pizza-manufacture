version: '3'

tasks:

  up:
    desc: Start all services in detached mode
    cmds:
      - docker compose up -d

  down:
    desc: Stop containers, remove local images and volumes
    cmds:
      - docker compose down --rmi local --volumes

  api:restart:
    desc: Rebuild image and restart API
    cmds:
      - docker compose build --no-cache api
      - docker compose up -d api
  
  gui:restart:
    desc: Rebuild image and restart GUI
    cmds:
      - docker compose rm -fsv gui
      - docker compose build --no-cache gui
      - docker compose up -d gui

  docker:build:
    desc: Build production Docker images for API and GUI (tag v1)
    cmds:
      - docker build -t pizza-api:v1 -f API/Dockerfile API
      - docker build -t pizza-gui:v1 -f GUI/Dockerfile.prod GUI

  helm:install:
    desc: Deploy or upgrade the application using Helm in 'pizza-factory' namespace
    cmds:
      - helm upgrade --install pizza-app ./pizza-chart --namespace pizza-factory --create-namespace

  dev:redeploy:
    desc: Full cycle - build new images, upgrade Helm release, and restart pods
    deps: [docker:build]
    cmds:
      - task: helm:install
      - task: k8s:restart

  k8s:restart:
    desc: Force restart of pods in pizza-factory namespace
    cmds:
      - kubectl rollout restart deployment pizza-api -n pizza-factory
      - kubectl rollout restart deployment pizza-gui -n pizza-factory

  k8s:status:
    desc: Quick overview of cluster status in pizza-factory namespace
    cmds:
      - kubectl get pods -n pizza-factory
      - kubectl get services -n pizza-factory

  k8s:logs:
    desc: Follow live logs from the API pod
    cmds:
      - kubectl logs -l app=pizza-api -n pizza-factory -f --tail=50

  db:tunnel:
    desc: Open a tunnel to the database on port 5432
    cmds:
      - echo "Opening tunnel... Connect via localhost:5432."
      - kubectl port-forward svc/pizza-app-postgresql 5432:5432 -n pizza-factory

  ops:install:
    desc: Installs Loki, Promtail and Grafana in 'monitoring' namespace
    cmds:
      - helm repo add grafana https://grafana.github.io/helm-charts
      - helm repo update
      - helm upgrade --install loki grafana/loki-stack --namespace=monitoring --create-namespace --set grafana.enabled=true

  ops:pass:
    desc: Reveals the Grafana admin password (base64 encoded)
    cmds:
      - kubectl get secret --namespace monitoring loki-grafana -o jsonpath="{.data.admin-password}"

  ops:grafana:
    desc: Opens tunnel to Grafana dashboard on localhost:3000
    cmds:
      - echo "Grafana available at http://localhost:3000 (User admin)"
      - echo "Run 'task ops:pass' in another terminal to get the password."
      - kubectl port-forward --namespace monitoring service/loki-grafana 3000:80
  
  default:
    cmds:
      - task --list
